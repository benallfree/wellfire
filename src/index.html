<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wellfire</title>
<style>
body{margin:0;overflow:hidden;font:15px system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#ui{position:fixed;left:16px;top:16px;text-shadow:0 1px 2px #000}
#bar{width:200px;height:12px;background:#0006;border:2px solid #fff;border-radius:8px;overflow:hidden;margin-bottom:6px}
#hp{height:100%;background:#e33;width:100%}
#gold{display:inline-block;color:#fd4}
#gold i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(#ffe680,#c8901a);border:1px solid #8a5a10;vertical-align:-1px;margin-right:4px}
#airbar{height:6px;width:200px;transition:opacity .4s}
#air{height:100%;background:#7cf;width:100%;border-radius:3px}
#foot{position:fixed;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;text-shadow:0 1px 2px #000}
#help{opacity:.8;text-align:center}
#pad{display:none}
#mbar{width:160px;height:8px;background:#0006;border:2px solid #fff;border-radius:6px;overflow:hidden;margin:6px 0 2px}
#mhp{height:100%;background:#d93;width:100%}
#mute{position:fixed;right:16px;top:16px;width:44px;height:44px;border-radius:50%;background:#0004;border:2px solid #fff8;font-size:22px;line-height:40px;text-align:center;cursor:pointer}
#mute.off{opacity:.4;text-decoration:line-through}
#nav{position:fixed;right:16px;top:70px;text-align:right;font-size:11px;text-shadow:0 1px 2px #000}
#map{display:block;width:160px;height:160px;border-radius:50%;border:2px solid #fff8;margin:0 0 4px auto;background:#0b0f18}
#tray{display:flex;gap:6px;pointer-events:auto}
#inv{pointer-events:auto;background:#0008;border-radius:8px;padding:8px 12px;text-align:center;line-height:2}
#inv b{display:inline-block;margin:4px;padding:0 10px;border-radius:8px;border:2px solid #fd4;cursor:pointer}
#inv .off{opacity:.5}
#tray b{position:relative;width:44px;height:44px;border-radius:8px;background:#0005;border:2px solid #fff6;font-size:24px;line-height:44px;text-align:center;cursor:pointer}
#tray .on{border-color:#fd4}
#tray .off{opacity:.5}
#tray i,#tray u{position:absolute;left:3px;top:-14px;font:10px system-ui;text-shadow:0 1px 2px #000}
#tray u{left:auto;top:-7px;right:-7px;min-width:12px;padding:0 3px;height:16px;border-radius:8px;background:#e33;font:bold 11px/16px system-ui;text-decoration:none;text-shadow:none}
#tip{opacity:0;white-space:nowrap}
.t #foot{bottom:110px}
#big{position:fixed;inset:0}
#pad b{position:fixed;bottom:30px;width:70px;height:70px;border-radius:50%;background:#fff3;border:2px solid #fff8;text-align:center;line-height:70px;font-size:13px}
</style>
</head>
<body>
<div id="ui"><div id="bar"><div id="hp"></div></div><div id="airbar"><div id="air"></div></div><div><span id="info"></span> · <b id="gold"><i></i><span id="g">0</span></b></div><div id="rider" hidden><div id="mbar"><div id="mhp"></div></div><span id="mname"></span></div></div>
<div id="foot"><div id="tip"></div><div id="inv" hidden></div><div id="tray"></div><div id="help">W/S walk · A/D turn · Q/E strafe · drag to turn · Space attack/drop · F swap · 1-5 tray · 6 craft · T torch · B boat · R ride/board/aim · C camera · N map · M mute</div></div>
<b id="mute">♪</b>
<div id="nav"><canvas id="map" width="160" height="160"></canvas><div id="pos"></div></div>
<div id="pad"><b id="hit" style="right:30px">HIT</b><b id="swap" style="right:120px">SWAP</b><b id="mnt" style="right:210px">RIDE</b><b id="lit" style="right:30px;bottom:200px">LIGHT</b></div>
<canvas id="big" hidden></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="application/json" id="models">
<!--MODELS-->
</script>
<script type="application/json" id="score">
<!--SCORE-->
</script>
<script type="module">
<!--CODE-->
</script>
</body>
</html>
